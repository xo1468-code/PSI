<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기출문제 추가</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  body { font-family: "Malgun Gothic", sans-serif; max-width: 900px; margin: 0 auto; padding: 24px 16px; background: #f6f7f9; color: #1d2330; }
  h1 { font-size: 22px; }
  .card { background: #fff; border: 1px solid #dde1e8; border-radius: 10px; padding: 16px 18px; margin: 14px 0; }
  .drop { border: 2px dashed #9aa6b8; border-radius: 10px; padding: 28px; text-align: center; cursor: pointer; background: #fff; }
  .drop.over { background: #eef4ff; border-color: #3b6fd8; }
  .ok { color: #1a7f45; } .warn { color: #b26a00; } .err { color: #c0392b; }
  pre { white-space: pre-wrap; font-size: 13px; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #3b6fd8; background: #3b6fd8; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .q { border-top: 1px solid #eee; padding: 8px 0; font-size: 14px; }
  .q img { max-width: 100%; border: 1px solid #ddd; margin: 4px 0; }
  a { color: #3b6fd8; }
</style>
</head>
<body>
<h1>기출문제 추가 도구</h1>
<div class="card">
  <b>사용법</b>: 전자문제집 CBT(comcbt.com) 형식의 <b>교사용 PDF</b>(정답이 ❶❷처럼 검게 표시된 것)를 아래에 끌어다 놓으세요. 여러 개를 한 번에 넣어도 됩니다.
  글상자(박스) 내용은 이미지로 잘라 문제에 붙입니다. 저장이 끝나면 <a href="/index.html">학습 프로그램</a>을 새로고침하세요.
</div>
<label class="drop" id="drop">여기에 PDF를 끌어다 놓거나 클릭해서 선택
  <input type="file" id="file" accept="application/pdf" multiple hidden>
</label>
<div id="log"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const SUBJECTS = { 1: '유통물류일반', 2: '상권분석', 3: '유통마케팅', 4: '유통정보' };
const EMPTY = '①②③④⑤', FILLED = '❶❷❸❹❺';
const RENDER_SCALE = 2.5;

function mult(m1, m2) {
  return [m1[0]*m2[0] + m1[2]*m2[1], m1[1]*m2[0] + m1[3]*m2[1], m1[0]*m2[2] + m1[2]*m2[3],
          m1[1]*m2[2] + m1[3]*m2[3], m1[0]*m2[4] + m1[2]*m2[5] + m1[4], m1[1]*m2[4] + m1[3]*m2[5] + m1[5]];
}

// 페이지에 그려진 이미지들의 위치(뷰포트 좌표, scale 1)를 구한다.
async function findImages(page, vp) {
  const ops = await page.getOperatorList();
  const O = pdfjsLib.OPS;
  let ctm = [1, 0, 0, 1, 0, 0]; const stack = []; const boxes = [];
  for (let i = 0; i < ops.fnArray.length; i++) {
    const fn = ops.fnArray[i], args = ops.argsArray[i];
    if (fn === O.save) stack.push(ctm);
    else if (fn === O.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
    else if (fn === O.transform) ctm = mult(ctm, args);
    else if (fn === O.paintImageXObject || fn === O.paintInlineImageXObject || fn === O.paintImageMaskXObject) {
      const p1 = [ctm[4], ctm[5]], p2 = [ctm[0] + ctm[2] + ctm[4], ctm[1] + ctm[3] + ctm[5]];
      const r = vp.convertToViewportRectangle([p1[0], p1[1], p2[0], p2[1]]);
      const x = Math.min(r[0], r[2]), y = Math.min(r[1], r[3]), w = Math.abs(r[2] - r[0]), h = Math.abs(r[3] - r[1]);
      if (w > 40 && h > 12) boxes.push({ x, y, w, h });
    }
  }
  return boxes;
}

async function cropImages(page, boxes) {
  if (!boxes.length) return [];
  const vp = page.getViewport({ scale: RENDER_SCALE });
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = vp.height;
  // intent 'print' 는 requestAnimationFrame 을 쓰지 않아 탭이 백그라운드여도 렌더링이 멈추지 않는다
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp, intent: 'print' }).promise;
  return boxes.map(b => {
    const pad = 3, s = RENDER_SCALE;
    const sx = Math.max(0, (b.x - pad) * s), sy = Math.max(0, (b.y - pad) * s);
    const sw = Math.min(canvas.width - sx, (b.w + pad * 2) * s), sh = Math.min(canvas.height - sy, (b.h + pad * 2) * s);
    const c = document.createElement('canvas'); c.width = sw; c.height = sh;
    c.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
    return c.toDataURL('image/png');
  });
}

// PDF 한 개를 읽어 { header, stream, images } 를 만든다.
// stream: 읽는 순서(페이지 → 왼쪽 단 → 오른쪽 단, 위→아래)대로 이어 붙인 텍스트. 이미지 자리는 ⟦IMG:k⟧ 로 표시.
async function readPdf(data) {
  const pdf = await pdfjsLib.getDocument({ data }).promise;
  let header = '', stream = ''; const images = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    // pdf.js 는 줄 끝의 공백 글리프를 버리므로, 원본 showText 문자열(텍스트 항목과 1:1 대응)에서 뒤 공백 여부를 가져온다
    const ops = await page.getOperatorList();
    const raw = [];
    for (let i = 0; i < ops.fnArray.length; i++) {
      if (ops.fnArray[i] !== pdfjsLib.OPS.showText) continue;
      const s = ops.argsArray[i][0].map(g => typeof g === 'number' ? '' : (g.unicode || '')).join('');
      if (s.trim()) raw.push(s);
    }
    const items = tc.items.filter(i => i.str.trim()).map((i, k) => ({
      x: i.transform[4], y: vp.height - i.transform[5],
      s: i.str.trim() + (raw[k] && raw[k].trim() === i.str.trim() && /\s$/.test(raw[k]) ? ' ' : '')
    }));
    const footer = items.find(i => i.s.startsWith('최강') && i.y > vp.height - 60);
    const mid = vp.width / 2, top = 45, bottom = footer ? footer.y - 6 : vp.height - 25;
    if (p === 1) header = items.filter(i => i.y < top).map(i => i.s).join(' ');
    const entries = [];
    for (const it of items) {
      if (it.y < top || it.y > bottom) continue;
      entries.push({ col: it.x < mid ? 0 : 1, y: it.y, x: it.x, s: it.s });
    }
    const boxes = await findImages(page, vp);
    const keep = boxes.filter(b => b.y > top && b.y + b.h < bottom);
    const urls = await cropImages(page, keep);
    keep.forEach((b, k) => {
      entries.push({ col: b.x + b.w / 2 < mid ? 0 : 1, y: b.y + 1, x: 0, img: images.length });
      images.push(urls[k]);
    });
    for (const col of [0, 1]) {
      const es = entries.filter(e => e.col === col).sort((a, b) => a.y - b.y || a.x - b.x);
      let line = [], lineY = null;
      const flush = () => { if (line.length) stream += line.sort((a, b) => a.x - b.x).map(e => e.s).join('') + '\n'; line = []; };
      for (const e of es) {
        if (e.img !== undefined) { flush(); stream += `⟦IMG:${e.img}⟧\n`; lineY = null; continue; }
        if (lineY !== null && Math.abs(e.y - lineY) > 3) flush();
        if (!line.length) lineY = e.y;
        line.push(e);
      }
      flush();
    }
  }
  return { header, stream, images };
}

function clean(s) {
  return s.replace(/\n/g, '').replace(/[  ]+/g, ' ').trim();
}

function parseExam(stream) {
  let body = stream, tail = '';
  const cut = stream.search(/전자문제집\s*CBT\s*홈페이지/);
  if (cut >= 0) { body = stream.slice(0, cut); tail = stream.slice(cut); }
  const tableAnswers = [...tail].filter(ch => EMPTY.includes(ch)).map(ch => EMPTY.indexOf(ch) + 1);

  // 과목 표시 위치
  const subjMarks = [...body.matchAll(/([1-5])과목\s*:\s*([^\n]+)/g)].map(m => ({ at: m.index, n: +m[1], name: m[2].trim(), len: m[0].length }));
  // 과목 표시 줄은 본문에서 지운다(같은 길이 공백으로 바꿔 위치 유지)
  for (const m of subjMarks) body = body.slice(0, m.at) + ' '.repeat(m.len) + body.slice(m.at + m.len);

  const starts = [], warnings = [];
  let pos = 0, misses = 0;
  for (let n = 1; misses < 3; n++) {
    const re = new RegExp(`(^|\\n)${n}\\.\\s`, 'g');
    re.lastIndex = pos;
    const m = re.exec(body);
    if (!m) { misses++; continue; }
    if (misses) warnings.push(`${n - misses}~${n - 1}번: 문제 시작을 찾지 못함`);
    misses = 0;
    const at = m.index + m[1].length;
    starts.push({ n, at, textAt: at + m[0].length - m[1].length });
    pos = at + 1;
  }
  const questions = [];
  starts.forEach((st, k) => {
    const end = k + 1 < starts.length ? starts[k + 1].at : body.length;
    let chunk = body.slice(st.textAt, end);
    const imgs = [...chunk.matchAll(/⟦IMG:(\d+)⟧/g)].map(m => +m[1]);
    chunk = chunk.replace(/⟦IMG:\d+⟧/g, '');
    const parts = chunk.split(/([①②③④⑤❶❷❸❹❺])/);
    const q = clean(parts[0]);
    let choices = [], answers = [];
    for (let i = 1; i < parts.length; i += 2) {
      const mk = parts[i];
      if (FILLED.includes(mk)) answers.push(choices.length + 1);
      choices.push(clean(parts[i + 1] || ''));
    }
    // 보기 내용 자체가 ①~⑤ 인 경우(글상자 안의 항목을 고르는 문제): "① ①" 쌍을 하나로 합친다
    if (choices.length === 10 && choices.every((c, i) => i % 2 === 1 || c === '')) {
      choices = [1, 2, 3, 4, 5].map(i => EMPTY[i - 1]);
      answers = [...new Set(answers.map(a => Math.ceil(a / 2)))];
    }
    let subject = 0, subjectName = '';
    for (const m of subjMarks) if (m.at < st.at) { subject = m.n; subjectName = m.name; }
    questions.push({ n: st.n, subject, subjectName, q, choices, answers, imgs });
  });
  // 정답 표시가 없으면 마지막 페이지 정답표로 보충
  questions.forEach((q, i) => {
    if (!q.answers.length && tableAnswers[i]) q.answers = [tableAnswers[i]];
    if (tableAnswers.length && tableAnswers[i] && !q.answers.includes(tableAnswers[i])) warnings.push(`${q.n}번: 문제지 표시(${q.answers}) ≠ 정답표(${tableAnswers[i]})`);
    if (!q.answers.length) warnings.push(`${q.n}번: 정답을 찾지 못함`);
    if (q.choices.length !== 5) warnings.push(`${q.n}번: 보기 ${q.choices.length}개`);
    if (/글상자|아래\s*표|다음\s*표/.test(q.q) && !q.imgs.length) warnings.push(`${q.n}번: 글상자 이미지 없음`);
  });
  return { questions, warnings, subjMarks };
}

function examIdFrom(header, fileName) {
  let m = header.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/) || fileName.match(/(\d{4})(\d{2})(\d{2})/);
  if (!m) return null;
  const pad = s => String(s).padStart(2, '0');
  return { id: `${m[1]}-${pad(m[2])}-${pad(m[3])}`, title: `${m[1]}년 ${+m[2]}월 ${+m[3]}일` };
}

async function save(path, content, base64 = false) {
  const r = await fetch('/__save', { method: 'POST', body: JSON.stringify({ path, content, base64 }) });
  if (!r.ok) throw new Error('저장 실패: ' + path);
}

async function loadList() {
  try {
    const txt = await (await fetch('/data/list.js', { cache: 'no-store' })).text();
    const m = txt.match(/\[[\s\S]*\]/);
    return m ? JSON.parse(m[0]) : [];
  } catch { return []; }
}

// 변환 결과를 data/<id>.js, images/<id>/ 에 저장하고 data/list.js 를 갱신한다.
async function convert(data, fileName, { write = true } = {}) {
  const { header, stream, images } = await readPdf(data);
  const meta = examIdFrom(header, fileName);
  if (!meta) throw new Error('시험 날짜를 찾을 수 없습니다: ' + fileName);
  const { questions, warnings } = parseExam(stream);
  const exam = {
    id: meta.id, title: meta.title, source: fileName,
    subjects: SUBJECTS,
    questions: questions.map(q => {
      const o = { n: q.n, s: q.subject, q: q.q, c: q.choices, a: q.answers.length === 1 ? q.answers[0] : q.answers };
      if (q.imgs.length) o.img = q.imgs.map((k, j) => `images/${meta.id}/q${String(q.n).padStart(2, '0')}${q.imgs.length > 1 ? '-' + (j + 1) : ''}.png`);
      return o;
    })
  };
  if (write) {
    for (const q of questions) {
      const ex = exam.questions.find(e => e.n === q.n);
      for (let j = 0; j < q.imgs.length; j++) await save(ex.img[j], images[q.imgs[j]].split(',')[1], true);
    }
    const js = `// ${exam.title} 유통관리사 2급 기출 (원본: ${fileName})\n(window.EXAMS = window.EXAMS || []).push(${JSON.stringify(exam, null, 1)});\n`;
    await save(`data/${exam.id}.js`, js);
    const list = await loadList();
    if (!list.includes(`${exam.id}.js`)) list.push(`${exam.id}.js`);
    list.sort();
    await save('data/list.js', `// 불러올 기출문제 파일 목록 (기출문제 추가 도구가 자동으로 갱신합니다)\nwindow.EXAM_FILES = ${JSON.stringify(list, null, 1)};\n`);
  }
  return { exam, warnings, images, questions };
}

function show(res, fileName) {
  const div = document.createElement('div'); div.className = 'card';
  const n = res.exam.questions.length;
  const bySubj = [1, 2, 3, 4].map(s => res.exam.questions.filter(q => q.s === s).length).join(' / ');
  div.innerHTML = `<b>${fileName}</b> → <b>${res.exam.title}</b> : 문제 ${n}개 (과목별 ${bySubj})<br>` +
    (res.warnings.length ? `<pre class="warn">확인 필요:\n${res.warnings.join('\n')}</pre>` : '<span class="ok">✔ 이상 없음 — 저장 완료</span>');
  document.getElementById('log').prepend(div);
}

async function handleFiles(files) {
  for (const f of files) {
    try {
      const res = await convert(new Uint8Array(await f.arrayBuffer()), f.name);
      show(res, f.name);
    } catch (e) {
      const d = document.createElement('div'); d.className = 'card err'; d.textContent = `${f.name}: ${e.message}`;
      document.getElementById('log').prepend(d);
    }
  }
}

const drop = document.getElementById('drop');
document.getElementById('file').addEventListener('change', e => handleFiles([...e.target.files]));
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); handleFiles([...e.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith('.pdf'))); });

// 테스트/일괄 처리용: 서버에 있는 PDF 경로로 변환
window.convertUrl = async (url, opts) => {
  const data = new Uint8Array(await (await fetch(encodeURI(url))).arrayBuffer());
  const res = await convert(data, url.split('/').pop(), opts);
  show(res, url.split('/').pop());
  return res;
};
</script>
</body>
</html>
