<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유통관리사 2급 기출 학습</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1d2330; --muted: #6b7486; --line: #dde2ea;
    --accent: #2f6fde; --accent-soft: #e8f0fd; --ok: #1a8a4a; --ok-soft: #e4f5ea;
    --bad: #d0392b; --bad-soft: #fdeaea; --warn: #c27a00; --star: #f2a900;
    --shadow: 0 1px 3px rgba(20, 30, 50, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d; --card: #1d2129; --text: #e5e8ee; --muted: #98a1b2; --line: #2e343f;
      --accent: #6b9bf0; --accent-soft: #233150; --ok: #4cc281; --ok-soft: #1c3627;
      --bad: #f07466; --bad-soft: #3e2422; --warn: #e0a640; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171d; --card: #1d2129; --text: #e5e8ee; --muted: #98a1b2; --line: #2e343f;
    --accent: #6b9bf0; --accent-soft: #233150; --ok: #4cc281; --ok-soft: #1c3627;
    --bad: #f07466; --bad-soft: #3e2422; --warn: #e0a640; --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 16px; line-height: 1.6; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }
  header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header.top h1 { font-size: 21px; margin: 0; flex: 1; cursor: pointer; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 13px; color: var(--muted); }
  .modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .mode { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); transition: border-color .15s; }
  .mode:hover { border-color: var(--accent); }
  .mode b { display: block; font-size: 16px; margin-bottom: 4px; }
  .mode span { font-size: 13px; color: var(--muted); }
  .resume { display: flex; align-items: center; gap: 12px; border-color: var(--accent); background: var(--accent-soft); }
  .resume div { flex: 1; }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 9px 18px; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.plain { border-color: var(--line); background: var(--card); color: var(--text); font-weight: 400; }
  .btn:disabled { opacity: .45; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .subj-row { display: grid; grid-template-columns: 110px 1fr 90px; gap: 10px; align-items: center; margin: 8px 0; font-size: 14px; }

  /* 설정 폼 */
  .form-row { margin: 14px 0; }
  .form-row > label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  select, input[type=number] { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }

  /* 문제 풀이 */
  .quiz-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .quiz-head .title { font-weight: 700; flex: 1; min-width: 160px; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
  .timer.low { background: var(--bad-soft); color: var(--bad); }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .star { margin-left: auto; border: none; background: none; font-size: 22px; line-height: 1; color: var(--muted); padding: 0 4px; }
  .star.on { color: var(--star); }
  .qtext { font-size: 17px; font-weight: 600; margin: 4px 0 12px; word-break: keep-all; }
  .qtext .num { color: var(--accent); margin-right: 6px; }
  .qimg { display: block; width: 560px; max-width: 100%; margin: 6px 0 12px; border-radius: 6px; background: #fff; border: 1px solid var(--line); }
  .choices { display: grid; gap: 8px; }
  .choice { display: flex; gap: 10px; text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 11px 14px; word-break: keep-all; transition: border-color .1s, background .1s; }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice .mk { font-weight: 700; color: var(--muted); flex: none; }
  .choice.sel { border-color: var(--accent); background: var(--accent-soft); }
  .choice.sel .mk { color: var(--accent); }
  .choice.correct { border-color: var(--ok); background: var(--ok-soft); }
  .choice.correct .mk { color: var(--ok); }
  .choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .choice.wrong .mk { color: var(--bad); }
  .choice:disabled { cursor: default; }
  .feedback { margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-weight: 600; }
  .feedback.ok { background: var(--ok-soft); color: var(--ok); }
  .feedback.bad { background: var(--bad-soft); color: var(--bad); }
  .memo { margin-top: 12px; }
  .memo textarea { width: 100%; min-height: 60px; font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
  .memo summary { cursor: pointer; font-size: 14px; color: var(--muted); }
  .nav { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
  .nav .sp { flex: 1; }
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; }
  .pal { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 4px 0; font-size: 13px; font-variant-numeric: tabular-nums; }
  .pal.ans { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .pal.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .pal.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .pal.cur { outline: 2px solid var(--text); outline-offset: 1px; }
  .pal-subj { font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 6px; }

  /* 결과 */
  .score-big { font-size: 40px; font-weight: 800; }
  .pass { color: var(--ok); } .fail { color: var(--bad); }
  .review-item { border-top: 1px solid var(--line); padding: 10px 0; font-size: 14px; }
  .review-item summary { cursor: pointer; word-break: keep-all; }
  .review-item .q { word-break: keep-all; }
  .review-body { padding: 8px 0 0 4px; display: grid; gap: 4px; }
  .explain { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 15px; }
  .explain-head { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .ai-badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--warn); }
  .explain-body { white-space: pre-line; word-break: keep-all; }
  .explain-note { margin-top: 8px; font-size: 12px; color: var(--muted); }
  /* D-DAY */
  .dday { display: flex; align-items: center; gap: 18px; background: linear-gradient(135deg, var(--accent), #7b5be6); color: #fff; border: none; }
  .dday-num { font-size: 40px; font-weight: 800; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dday-body { flex: 1; min-width: 0; word-break: keep-all; }
  .dday-body b { display: block; font-size: 17px; }
  .dday-body .sub { font-size: 13px; opacity: .85; }
  .dday-body .cheer { margin-top: 6px; font-size: 14px; }
  .empty { text-align: center; padding: 30px 10px; color: var(--muted); }
  .kbd { font-size: 12px; color: var(--muted); }
  .hide { display: none !important; }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .subj-row { grid-template-columns: 80px 1fr 70px; }
    .qtext { font-size: 16px; }
    .kbd { display: none; }
    .dday { gap: 14px; }
    .dday-num { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="home-link">📘 유통관리사 2급 기출 학습</h1>
    <button class="icon-btn" id="theme-btn" title="화면 테마">🌓</button>
  </header>
  <main id="app"><div class="empty">불러오는 중…</div></main>
</div>

<script src="data/list.js"></script>
<script>
'use strict';
const SUBJECTS = { 1: '유통물류일반', 2: '상권분석', 3: '유통마케팅', 4: '유통정보' };
const MARKS = ['①', '②', '③', '④', '⑤'];
const EXAM_MINUTES = 100;
const STORE_KEY = 'ycg2-study-v1';
const EXAM_DATE = '2026-11-14';   // 다음 시험일 (바뀌면 여기만 고치면 됨)
const CHEERS = [
  '지금까지 푼 문제가 시험장에서 힘이 됩니다.',
  '하루 한 회차씩, 꾸준함이 합격을 만듭니다.',
  '틀린 문제는 오답노트에서 한 번 더! 같은 실수는 두 번 없다.',
  '과목마다 40점, 평균 60점이면 합격. 충분히 할 수 있어요.',
  '어제보다 한 문제 더 맞히면 그걸로 성공입니다.',
  '헷갈리는 개념은 해설로 정리하고 넘어가요.',
  '끝까지 포기하지 않는 사람이 합격합니다.',
];

/* ---------- 저장소 ---------- */
const store = (() => {
  let data;
  try { data = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { data = {}; }
  data.stats ||= {}; data.bookmarks ||= {}; data.memos ||= {}; data.history ||= [];
  return {
    data,
    save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { console.warn('저장 실패', e); } },
  };
})();

/* ---------- 데이터 로딩 ---------- */
let EXAMS = [], ALL = [], BY_ID = {};
const loadScript = (src, quiet) => new Promise(res => {
  const s = document.createElement('script');
  s.src = src; s.onload = res; s.onerror = () => { if (!quiet) console.warn('불러오기 실패:', src); res(); };
  document.head.appendChild(s);
});
// 해설은 회차별 data/<id>.exp.js 에 있으며, 없는 회차는 조용히 건너뛴다
const explainOf = q => ((window.EXPLAIN || {})[q.examId] || {})[q.n];
function explainHtml(q) {
  const exp = explainOf(q);
  if (!exp) return '';
  return `<div class="explain"><div class="explain-head">💡 해설 <span class="ai-badge">AI 작성 · 참고용</span></div>
    <div class="explain-body">${esc(exp)}</div>
    <div class="explain-note">AI가 작성한 참고용 해설로, 틀린 내용이 있을 수 있습니다. 정확한 내용은 교재나 법령 원문으로 확인하세요.</div></div>`;
}
function loadExams() {
  const files = window.EXAM_FILES || [];
  return Promise.all(files.map(f => loadScript('data/' + f)))
    .then(() => Promise.all((window.EXAMS || []).map(ex => loadScript(`data/${ex.id}.exp.js`, true))))
    .then(() => {
    EXAMS = (window.EXAMS || []).slice().sort((a, b) => b.id.localeCompare(a.id));
    ALL = []; BY_ID = {};
    for (const ex of EXAMS) for (const q of ex.questions) {
      const item = { ...q, id: `${ex.id}#${q.n}`, examId: ex.id, examTitle: ex.title, answers: Array.isArray(q.a) ? q.a : [q.a] };
      ALL.push(item); BY_ID[item.id] = item;
    }
  });
}

/* ---------- 유틸 ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
const fmtDate = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

function record(q, choice) {
  const ok = q.answers.includes(choice);
  const st = store.data.stats[q.id] ||= { tries: 0, correct: 0, wrong: 0 };
  st.tries++; ok ? st.correct++ : st.wrong++;
  st.last = ok; st.at = Date.now();
  return ok;
}
const isWrongNote = id => store.data.stats[id] && store.data.stats[id].last === false;

/* ---------- D-DAY ---------- */
function ddayHtml() {
  const [y, m, d] = EXAM_DATE.split('-').map(Number);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const left = Math.round((new Date(y, m - 1, d) - today) / 86400000);
  if (left < 0) return '';   // 시험이 지나면 숨김
  const dow = '일월화수목금토'[new Date(y, m - 1, d).getDay()];
  const todayCnt = Object.values(store.data.stats).filter(st => st.at >= today.getTime()).length;
  const cheer = CHEERS[(today.getTime() / 86400000 | 0) % CHEERS.length];
  const [title, msg] = left === 0
    ? ['오늘이 시험날! 🍀', '긴장하지 말고 아는 문제부터 차근차근. 꼭 합격하세요, 화이팅! 💪']
    : left === 1
      ? ['내일이 시험이에요!', '오늘은 오답노트만 가볍게 보고 푹 자기. 꼭 합격하세요, 화이팅! 💪']
      : ['유통관리사 2급 꼭 합격하자! 💪', `${cheer} 화이팅! 🔥`];
  return `<div class="card dday"><div class="dday-num">${left === 0 ? 'D-DAY' : 'D-' + left}</div>
    <div class="dday-body"><b>${title}</b><div class="sub">시험일 ${m}월 ${d}일 (${dow}) · 오늘 푼 문제 ${todayCnt}개</div>
    <div class="cheer">${msg}</div></div></div>`;
}

/* ---------- 화면: 홈 ---------- */
function renderHome() {
  stopTimer();
  const stats = store.data.stats;
  const solvedIds = Object.keys(stats).filter(id => BY_ID[id]);
  const tries = solvedIds.reduce((s, id) => s + stats[id].tries, 0);
  const correct = solvedIds.reduce((s, id) => s + stats[id].correct, 0);
  const wrongCnt = ALL.filter(q => isWrongNote(q.id)).length;
  const bmCnt = ALL.filter(q => store.data.bookmarks[q.id]).length;
  const sess = store.data.session;

  const subjRows = [1, 2, 3, 4].map(s => {
    const ids = solvedIds.filter(id => BY_ID[id].s === s);
    const t = ids.reduce((a, id) => a + stats[id].tries, 0), c = ids.reduce((a, id) => a + stats[id].correct, 0);
    const total = ALL.filter(q => q.s === s).length;
    return `<div class="subj-row"><span>${SUBJECTS[s]}</span><div class="bar"><i style="width:${pct(c, t)}%"></i></div>
      <span class="muted">${t ? pct(c, t) + '%' : '-'} <span class="small">(${ids.length}/${total})</span></span></div>`;
  }).join('');

  const examRows = EXAMS.map(ex => {
    const ids = ex.questions.map(q => `${ex.id}#${q.n}`);
    const done = ids.filter(id => stats[id]).length;
    const hist = store.data.history.filter(h => h.examId === ex.id);
    const best = hist.length ? Math.max(...hist.map(h => h.avg)) : null;
    return `<tr><td>${esc(ex.title)}</td><td><div class="bar"><i style="width:${pct(done, ids.length)}%"></i></div></td>
      <td class="muted">${done}/${ids.length}</td><td>${best === null ? '<span class="muted">-</span>' : best + '점'}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn plain small" data-study="${ex.id}">학습</button>
      <button class="btn small" data-exam="${ex.id}">실전</button></td></tr>`;
  }).join('');

  const hist = store.data.history.slice(-8).reverse().map(h => `<tr><td>${fmtDate(h.at)}</td><td>${esc(h.title)}</td>
    <td>${h.avg}점</td><td class="${h.pass ? 'pass' : 'fail'}">${h.pass ? '합격' : '불합격'}</td><td class="muted">${h.subj.join(' / ')}</td></tr>`).join('');

  $('#app').innerHTML = `
    ${ddayHtml()}
    ${sess ? `<div class="card resume"><div><b>이어서 풀기</b><div class="small muted">${esc(sess.title)} · ${Object.keys(sess.picks).length}/${sess.qids.length} 문제 풀이</div></div>
      <button class="btn plain" id="drop-sess">버리기</button><button class="btn" id="resume">계속</button></div>` : ''}
    <div class="stats" style="margin-bottom:16px">
      <div class="stat"><b>${ALL.length}</b><span>전체 문제 (${EXAMS.length}회차)</span></div>
      <div class="stat"><b>${solvedIds.length}</b><span>풀어 본 문제</span></div>
      <div class="stat"><b>${tries ? pct(correct, tries) + '%' : '-'}</b><span>누적 정답률</span></div>
      <div class="stat"><b>${wrongCnt}</b><span>오답노트</span></div>
    </div>
    <div class="modes" style="margin-bottom:16px">
      <button class="mode" data-mode="exam"><b>📝 실전 모의고사</b><span>회차 선택 · 90문제 · ${EXAM_MINUTES}분 · 과목별 채점과 합격 판정</span></button>
      <button class="mode" data-mode="random-exam"><b>🎲 랜덤 모의고사</b><span>전 회차에서 과목별 25·20·25·20문제를 무작위 출제</span></button>
      <button class="mode" data-mode="study"><b>📖 학습 모드</b><span>회차·과목을 골라 한 문제씩 풀고 바로 정답 확인</span></button>
      <button class="mode" data-mode="wrong"><b>❌ 오답노트</b><span>최근에 틀린 문제 ${wrongCnt}개 · 맞히면 자동으로 빠짐</span></button>
      <button class="mode" data-mode="bookmark"><b>⭐ 즐겨찾기</b><span>표시해 둔 문제 ${bmCnt}개</span></button>
    </div>
    <div class="card"><h2>회차별 문제</h2><table><thead><tr><th>회차</th><th>진행</th><th></th><th>최고점</th><th></th></tr></thead><tbody>${examRows || '<tr><td colspan="5" class="empty">문제 데이터가 없습니다.</td></tr>'}</tbody></table></div>
    <div class="card"><h2>과목별 정답률</h2>${subjRows}</div>
    ${hist ? `<div class="card"><h2>최근 모의고사 기록</h2><table><thead><tr><th>일시</th><th>시험</th><th>평균</th><th>결과</th><th>과목별</th></tr></thead><tbody>${hist}</tbody></table></div>` : ''}
    <div class="card small muted">
      기출문제 추가: <b>기출문제추가.bat</b> 실행 → 교사용 PDF를 끌어다 놓기 → 이 화면 새로고침.
      &nbsp;<button class="btn plain small" id="backup">기록 백업</button>
      <button class="btn plain small" id="restore">기록 복원</button>
      <button class="btn plain small" id="reset">기록 초기화</button>
    </div>`;

  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    const m = b.dataset.mode;
    if (m === 'exam') renderExamPicker();
    else if (m === 'random-exam') startRandomExam();
    else if (m === 'study') renderStudySetup();
    else if (m === 'wrong') startList('오답노트', ALL.filter(q => isWrongNote(q.id)), '오답노트가 비어 있습니다. 문제를 풀다 틀리면 여기에 모입니다.');
    else if (m === 'bookmark') startList('즐겨찾기', ALL.filter(q => store.data.bookmarks[q.id]), '즐겨찾기한 문제가 없습니다. 문제 화면의 ☆를 눌러 추가하세요.');
  });
  document.querySelectorAll('[data-exam]').forEach(b => b.onclick = () => startExam(b.dataset.exam));
  document.querySelectorAll('[data-study]').forEach(b => b.onclick = () => startSession({ mode: 'study', title: `${BY_EXAM(b.dataset.study).title} 학습`, qids: ALL.filter(q => q.examId === b.dataset.study).map(q => q.id) }));
  if (sess) { $('#resume').onclick = () => openSession(sess); $('#drop-sess').onclick = () => { delete store.data.session; store.save(); renderHome(); }; }
  $('#reset').onclick = () => { if (confirm('풀이 기록, 오답노트, 즐겨찾기, 메모를 모두 지울까요?')) { localStorage.removeItem(STORE_KEY); location.reload(); } };
  $('#backup').onclick = backup;
  $('#restore').onclick = restore;
}
const BY_EXAM = id => EXAMS.find(e => e.id === id);

function backup() {
  const blob = new Blob([JSON.stringify(store.data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `유통관리사_학습기록_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
}
function restore() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    try {
      const d = JSON.parse(await inp.files[0].text());
      if (!d.stats) throw new Error();
      localStorage.setItem(STORE_KEY, JSON.stringify(d)); location.reload();
    } catch { alert('올바른 백업 파일이 아닙니다.'); }
  };
  inp.click();
}

/* ---------- 화면: 실전 회차 선택 ---------- */
function renderExamPicker() {
  $('#app').innerHTML = `<div class="card"><h2>📝 실전 모의고사 — 회차 선택</h2>
    <p class="small muted">실제 시험처럼 90문제를 ${EXAM_MINUTES}분 동안 풀고 제출하면 채점합니다. 합격 기준: 과목별 40점 이상, 평균 60점 이상.</p>
    <div class="chips">${EXAMS.map(e => `<button class="chip" data-exam="${e.id}">${esc(e.title)}</button>`).join('')}</div>
    <div class="nav"><button class="btn plain" id="back">← 처음으로</button></div></div>`;
  document.querySelectorAll('[data-exam]').forEach(b => b.onclick = () => startExam(b.dataset.exam));
  $('#back').onclick = renderHome;
}
function startExam(examId) {
  const ex = BY_EXAM(examId);
  startSession({ mode: 'exam', examId, title: `${ex.title} 실전 모의고사`, qids: ALL.filter(q => q.examId === examId).map(q => q.id) });
}
function startRandomExam() {
  const per = { 1: 25, 2: 20, 3: 25, 4: 20 };
  const qids = [1, 2, 3, 4].flatMap(s => shuffle(ALL.filter(q => q.s === s)).slice(0, per[s]).map(q => q.id));
  startSession({ mode: 'exam', title: '랜덤 모의고사', qids });
}

/* ---------- 화면: 학습 설정 ---------- */
function renderStudySetup() {
  const sel = { exams: new Set(EXAMS.map(e => e.id)), subj: new Set([1, 2, 3, 4]), filter: 'all', order: 'seq' };
  const draw = () => {
    const pool = ALL.filter(q => sel.exams.has(q.examId) && sel.subj.has(q.s) && (
      sel.filter === 'all' || (sel.filter === 'new' && !store.data.stats[q.id]) || (sel.filter === 'wrong' && isWrongNote(q.id))));
    $('#app').innerHTML = `<div class="card"><h2>📖 학습 모드</h2>
      <div class="form-row"><label>회차</label><div class="chips">${EXAMS.map(e => `<button class="chip ${sel.exams.has(e.id) ? 'on' : ''}" data-ex="${e.id}">${esc(e.title)}</button>`).join('')}</div></div>
      <div class="form-row"><label>과목</label><div class="chips">${[1, 2, 3, 4].map(s => `<button class="chip ${sel.subj.has(s) ? 'on' : ''}" data-s="${s}">${s}. ${SUBJECTS[s]}</button>`).join('')}</div></div>
      <div class="form-row"><label>문제 범위</label><div class="chips">
        ${[['all', '전체'], ['new', '안 푼 문제만'], ['wrong', '틀린 문제만']].map(([k, t]) => `<button class="chip ${sel.filter === k ? 'on' : ''}" data-f="${k}">${t}</button>`).join('')}</div></div>
      <div class="form-row"><label>순서</label><div class="chips">
        ${[['seq', '문제 순서대로'], ['rand', '무작위로 섞기']].map(([k, t]) => `<button class="chip ${sel.order === k ? 'on' : ''}" data-o="${k}">${t}</button>`).join('')}</div></div>
      <div class="form-row"><label>문제 수</label><input type="number" id="cnt" min="1" max="${pool.length}" value="${pool.length}"> <span class="small muted">/ 선택된 ${pool.length}문제</span></div>
      <div class="nav"><button class="btn plain" id="back">← 처음으로</button><span class="sp"></span><button class="btn" id="go" ${pool.length ? '' : 'disabled'}>시작</button></div></div>`;
    const toggle = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); draw(); };
    document.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => toggle(sel.exams, b.dataset.ex));
    document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => toggle(sel.subj, +b.dataset.s));
    document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { sel.filter = b.dataset.f; draw(); });
    document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { sel.order = b.dataset.o; draw(); });
    $('#back').onclick = renderHome;
    $('#go').onclick = () => {
      const n = Math.max(1, Math.min(pool.length, +$('#cnt').value || pool.length));
      const list = (sel.order === 'rand' ? shuffle(pool) : pool).slice(0, n);
      startSession({ mode: 'study', title: '학습 모드', qids: list.map(q => q.id) });
    };
  };
  draw();
}
function startList(title, list, emptyMsg) {
  if (!list.length) {
    $('#app').innerHTML = `<div class="card"><h2>${title}</h2><div class="empty">${emptyMsg}</div><div class="nav"><button class="btn plain" id="back">← 처음으로</button></div></div>`;
    $('#back').onclick = renderHome; return;
  }
  startSession({ mode: 'study', title, qids: list.map(q => q.id) });
}

/* ---------- 풀이 세션 ---------- */
let S = null, timerId = null;
function startSession(opts) {
  const sess = { ...opts, idx: 0, picks: {}, checked: {}, startedAt: Date.now(), elapsed: 0 };
  if (sess.mode === 'exam') sess.limit = EXAM_MINUTES * 60;
  openSession(sess);
}
function openSession(sess) {
  S = sess; S.qids = S.qids.filter(id => BY_ID[id]);
  if (!S.qids.length) { renderHome(); return; }
  S.resumedAt = Date.now();
  persist();
  if (S.mode === 'exam') startTimer();
  renderQuestion();
}
function persist() { store.data.session = S; store.save(); }
function elapsed() { return S.elapsed + Math.floor((Date.now() - S.resumedAt) / 1000); }
function startTimer() {
  stopTimer();
  timerId = setInterval(() => {
    const left = S.limit - elapsed();
    const el = $('#timer');
    if (el) { el.textContent = '⏱ ' + fmtTime(Math.max(0, left)); el.classList.toggle('low', left < 600); }
    if (left <= 0) { stopTimer(); alert('시험 시간이 끝났습니다. 자동으로 제출합니다.'); finishExam(); }
  }, 1000);
}
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }
function leaveSession() {
  if (S) { S.elapsed = elapsed(); persist(); }
  stopTimer(); S = null; renderHome();
}

function renderQuestion() {
  const q = BY_ID[S.qids[S.idx]];
  const exam = S.mode === 'exam';
  const pick = S.picks[q.id];
  const checked = !exam && S.checked[q.id];
  const answered = Object.keys(S.picks).length;
  const st = store.data.stats[q.id];

  const choiceHtml = q.c.map((c, i) => {
    const n = i + 1;
    let cls = '';
    if (checked) cls = q.answers.includes(n) ? 'correct' : (pick === n ? 'wrong' : '');
    else if (pick === n) cls = 'sel';
    // 보기 내용이 ①~⑤ 자체인 문제(글상자 항목 고르기)는 번호만 보여 준다
    const text = c === MARKS[i] ? '' : esc(c);
    return `<button class="choice ${cls}" data-c="${n}" ${checked ? 'disabled' : ''}><span class="mk">${MARKS[i]}</span><span>${text}</span></button>`;
  }).join('');

  let feedback = '';
  if (checked) {
    const ok = q.answers.includes(pick);
    feedback = `<div class="feedback ${ok ? 'ok' : 'bad'}">${ok ? '⭕ 정답입니다!' : `❌ 오답입니다. 정답은 ${q.answers.map(a => MARKS[a - 1]).join(', ')}`}</div>`;
  }

  // 문제 번호판: 실전은 과목별로 묶어서
  const palBtn = (id, i) => {
    let cls = '';
    if (exam) cls = S.picks[id] ? 'ans' : '';
    else if (S.checked[id]) cls = BY_ID[id].answers.includes(S.picks[id]) ? 'ok' : 'bad';
    return `<button class="pal ${cls} ${i === S.idx ? 'cur' : ''}" data-i="${i}">${exam && S.examId ? BY_ID[id].n : i + 1}</button>`;
  };
  let palette;
  if (exam) {
    palette = [1, 2, 3, 4].map(s => {
      const items = S.qids.map((id, i) => [id, i]).filter(([id]) => BY_ID[id].s === s);
      return items.length ? `<div class="pal-subj">${s}과목 ${SUBJECTS[s]}</div><div class="palette">${items.map(([id, i]) => palBtn(id, i)).join('')}</div>` : '';
    }).join('');
  } else palette = `<div class="palette">${S.qids.map(palBtn).join('')}</div>`;

  const doneCount = exam ? answered : Object.keys(S.checked).length;
  const correctCount = exam ? 0 : Object.keys(S.checked).filter(id => BY_ID[id].answers.includes(S.picks[id])).length;

  $('#app').innerHTML = `
    <div class="quiz-head">
      <button class="btn plain small" id="quit">← 나가기</button>
      <span class="title">${esc(S.title)}</span>
      ${exam ? `<span class="timer" id="timer">⏱ ${fmtTime(Math.max(0, S.limit - elapsed()))}</span>` : `<span class="small muted">정답 ${correctCount} / ${doneCount}</span>`}
    </div>
    <div class="progress"><i style="width:${pct(doneCount, S.qids.length)}%"></i></div>
    <div class="card">
      <div class="tags">
        <span class="tag">${S.idx + 1} / ${S.qids.length}</span>
        <span class="tag">${q.s}과목 ${SUBJECTS[q.s]}</span>
        <span class="tag">${esc(q.examTitle)} ${q.n}번</span>
        ${!exam && st && st.wrong ? `<span class="tag bad">틀린 횟수 ${st.wrong}</span>` : ''}
        <button class="star ${store.data.bookmarks[q.id] ? 'on' : ''}" id="star" title="즐겨찾기">${store.data.bookmarks[q.id] ? '★' : '☆'}</button>
      </div>
      <div class="qtext"><span class="num">${q.n}.</span>${esc(q.q)}</div>
      ${(q.img || []).map(src => `<img class="qimg" src="${esc(src)}" alt="문제 ${q.n} 글상자">`).join('')}
      <div class="choices">${choiceHtml}</div>
      ${feedback}
      ${checked ? explainHtml(q) : ''}
      ${!exam ? `<details class="memo" ${store.data.memos[q.id] ? 'open' : ''}><summary>📝 내 메모${store.data.memos[q.id] ? ' (작성됨)' : ''}</summary>
        <textarea id="memo" placeholder="풀이 요령, 헷갈린 개념 등을 적어 두세요. 자동 저장됩니다.">${esc(store.data.memos[q.id] || '')}</textarea></details>` : ''}
      <div class="nav">
        <button class="btn plain" id="prev" ${S.idx === 0 ? 'disabled' : ''}>← 이전</button>
        <span class="sp kbd">키보드: 1~5 선택 · ←/→ 이동${exam ? '' : ' · Enter 다음'}</span>
        ${S.idx < S.qids.length - 1 ? `<button class="btn" id="next">다음 →</button>` : `<button class="btn" id="finish">${exam ? '제출하기' : '결과 보기'}</button>`}
      </div>
    </div>
    <div class="card"><div class="small muted" style="margin-bottom:8px">${exam ? `푼 문제 ${answered} / ${S.qids.length}` : '문제 이동'}</div>${palette}
      ${exam ? `<div class="nav"><span class="sp"></span><button class="btn ghost" id="submit2">답안 제출</button></div>` : ''}</div>`;

  document.querySelectorAll('.choice').forEach(b => b.onclick = () => choose(+b.dataset.c));
  document.querySelectorAll('.pal').forEach(b => b.onclick = () => go(+b.dataset.i));
  $('#prev').onclick = () => go(S.idx - 1);
  if ($('#next')) $('#next').onclick = () => go(S.idx + 1);
  if ($('#finish')) $('#finish').onclick = finish;
  if ($('#submit2')) $('#submit2').onclick = finish;
  $('#quit').onclick = leaveSession;
  $('#star').onclick = () => {
    if (store.data.bookmarks[q.id]) delete store.data.bookmarks[q.id]; else store.data.bookmarks[q.id] = true;
    store.save(); renderQuestion();
  };
  const memo = $('#memo');
  if (memo) memo.oninput = () => {
    const v = memo.value.trim();
    if (v) store.data.memos[q.id] = memo.value; else delete store.data.memos[q.id];
    store.save();
  };
}

function choose(n) {
  const q = BY_ID[S.qids[S.idx]];
  if (S.mode === 'exam') {
    S.picks[q.id] = n; persist(); renderQuestion();
  } else {
    if (S.checked[q.id]) return;
    S.picks[q.id] = n; S.checked[q.id] = true;
    record(q, n); persist(); renderQuestion();
  }
}
function go(i) {
  if (i < 0 || i >= S.qids.length) return;
  S.idx = i; persist(); renderQuestion(); window.scrollTo({ top: 0 });
}
function finish() {
  if (S.mode === 'exam') {
    const left = S.qids.length - Object.keys(S.picks).length;
    if (!confirm(left ? `아직 ${left}문제를 풀지 않았습니다. 그래도 제출할까요?` : '답안을 제출할까요?')) return;
    finishExam();
  } else renderStudyResult();
}

function finishExam() {
  stopTimer();
  const dur = elapsed();
  const per = {};
  for (const id of S.qids) {
    const q = BY_ID[id]; const p = S.picks[id];
    const r = per[q.s] ||= { total: 0, correct: 0 };
    r.total++;
    if (p) { if (record(q, p)) r.correct++; }
    else { const st = store.data.stats[id] ||= { tries: 0, correct: 0, wrong: 0 }; st.tries++; st.wrong++; st.last = false; st.at = Date.now(); }
  }
  const subjScores = [1, 2, 3, 4].filter(s => per[s]).map(s => ({ s, score: Math.round(per[s].correct / per[s].total * 100), ...per[s] }));
  const avg = Math.round(subjScores.reduce((a, x) => a + x.score, 0) / subjScores.length);
  const pass = avg >= 60 && subjScores.every(x => x.score >= 40);
  store.data.history.push({ at: Date.now(), title: S.title, examId: S.examId || null, avg, pass, subj: subjScores.map(x => x.score), dur });
  const done = S; delete store.data.session; store.save(); S = null;
  renderExamResult(done, subjScores, avg, pass, dur);
}

function reviewList(sess, ids) {
  return ids.map(id => {
    const q = BY_ID[id]; const p = sess.picks[id];
    const choices = q.c.map((c, i) => {
      const cls = q.answers.includes(i + 1) ? 'pass' : (p === i + 1 ? 'fail' : '');
      return `<div class="${cls}">${MARKS[i]} ${c === MARKS[i] ? '' : esc(c)}</div>`;
    }).join('');
    return `<details class="review-item"><summary><span class="tag">${esc(q.examTitle)} ${q.n}번</span> <span class="q">${esc(q.q)}</span>
      <span class="small" style="white-space:nowrap">내 답 <b class="fail">${p ? MARKS[p - 1] : '—'}</b> · 정답 <b class="pass">${q.answers.map(a => MARKS[a - 1]).join(',')}</b></span></summary>
      <div class="review-body">${(q.img || []).map(src => `<img class="qimg" src="${esc(src)}" alt="">`).join('')}${choices}${explainHtml(q)}</div></details>`;
  }).join('');
}

function renderExamResult(sess, subjScores, avg, pass, dur) {
  const wrongIds = sess.qids.filter(id => !BY_ID[id].answers.includes(sess.picks[id]));
  $('#app').innerHTML = `
    <div class="card" style="text-align:center">
      <div class="muted">${esc(sess.title)} 결과 · 소요 ${fmtTime(dur)}</div>
      <div class="score-big ${pass ? 'pass' : 'fail'}">${avg}점 · ${pass ? '합격' : '불합격'}</div>
      <div class="small muted">합격 기준: 과목별 40점 이상 · 평균 60점 이상</div>
    </div>
    <div class="card"><h2>과목별 점수</h2>
      ${subjScores.map(x => `<div class="subj-row"><span>${SUBJECTS[x.s]}</span><div class="bar"><i style="width:${x.score}%;background:${x.score < 40 ? 'var(--bad)' : 'var(--accent)'}"></i></div>
        <span><b class="${x.score < 40 ? 'fail' : ''}">${x.score}점</b> <span class="small muted">${x.correct}/${x.total}</span></span></div>`).join('')}
    </div>
    <div class="card"><h2>틀린 문제 ${wrongIds.length}개</h2>
      ${wrongIds.length ? reviewList(sess, wrongIds) : '<div class="empty">모두 맞혔습니다! 🎉</div>'}
      <div class="nav"><button class="btn plain" id="home">처음으로</button><span class="sp"></span>
        ${wrongIds.length ? '<button class="btn" id="redo">틀린 문제 다시 풀기</button>' : ''}</div>
    </div>`;
  $('#home').onclick = renderHome;
  if ($('#redo')) $('#redo').onclick = () => startSession({ mode: 'study', title: `${sess.title} 오답 다시 풀기`, qids: wrongIds });
}

function renderStudyResult() {
  const sess = S;
  const doneIds = sess.qids.filter(id => sess.checked[id]);
  const wrongIds = doneIds.filter(id => !BY_ID[id].answers.includes(sess.picks[id]));
  const c = doneIds.length - wrongIds.length;
  delete store.data.session; store.save(); S = null;
  $('#app').innerHTML = `
    <div class="card" style="text-align:center">
      <div class="muted">${esc(sess.title)} 결과</div>
      <div class="score-big">${c} / ${doneIds.length} <span class="small muted">정답률 ${pct(c, doneIds.length)}%</span></div>
      ${doneIds.length < sess.qids.length ? `<div class="small muted">${sess.qids.length - doneIds.length}문제는 풀지 않았습니다.</div>` : ''}
    </div>
    <div class="card"><h2>틀린 문제 ${wrongIds.length}개</h2>
      ${wrongIds.length ? reviewList(sess, wrongIds) : '<div class="empty">틀린 문제가 없습니다.</div>'}
      <div class="nav"><button class="btn plain" id="home">처음으로</button><span class="sp"></span>
        ${wrongIds.length ? '<button class="btn" id="redo">틀린 문제 다시 풀기</button>' : ''}</div>
    </div>`;
  $('#home').onclick = renderHome;
  if ($('#redo')) $('#redo').onclick = () => startSession({ mode: 'study', title: '틀린 문제 다시 풀기', qids: wrongIds });
}

/* ---------- 키보드 ---------- */
document.addEventListener('keydown', e => {
  if (!S || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.ctrlKey || e.altKey || e.metaKey) return;
  if (/^[1-5]$/.test(e.key)) choose(+e.key);
  else if (e.key === 'ArrowLeft') go(S.idx - 1);
  else if (e.key === 'ArrowRight') go(S.idx + 1);
  else if (e.key === 'Enter' && S.mode !== 'exam' && S.checked[S.qids[S.idx]]) { if (S.idx < S.qids.length - 1) go(S.idx + 1); else finish(); }
});

/* ---------- 테마 ---------- */
(() => {
  let t; try { t = localStorage.getItem('ycg2-theme'); } catch {}
  if (t) document.documentElement.dataset.theme = t;
  $('#theme-btn').onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('ycg2-theme', next); } catch {}
  };
})();
$('#home-link').onclick = () => { if (S) leaveSession(); else renderHome(); };
window.addEventListener('beforeunload', () => { if (S) { S.elapsed = elapsed(); S.resumedAt = Date.now(); persist(); } });

loadExams().then(renderHome);
</script>
</body>
